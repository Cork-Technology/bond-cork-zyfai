name: Cork CI

permissions: {}

on:
  push:
    paths:
      - "cork/**"
      - ".github/workflows/cork.yml"
  pull_request:
    paths:
      - "cork/**"
      - ".github/workflows/cork.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: cork

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build

      - name: Run Forge tests
        run: forge test -vvv
